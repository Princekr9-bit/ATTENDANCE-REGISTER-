name: nirman_manager
description: "Nirman Manager — SK Sangam Enterprises. Site, labour attendance & payment manager."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Google (Gmail) Sign-In
  google_sign_in: ^6.2.1

  # UPI / external payment apps
  url_launcher: ^6.3.0

  # Utilities
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
